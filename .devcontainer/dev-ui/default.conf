# Every listener has one fixed backend; callers cannot select arbitrary targets.
map $server_port $workspace_port {
    8080 8765;
    8081 8766;
    8082 8767;
    8083 8768;
}

server {
    listen 8080;
    listen 8081;
    listen 8082;
    listen 8083;
    server_name _;
    # Resolve the workspace on demand, including after container recreation.
    resolver 127.0.0.11 valid=5s ipv6=off;
    location / {
        set $workspace http://workspace:$workspace_port;
        proxy_pass $workspace;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
