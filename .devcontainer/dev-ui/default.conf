server {
    listen 8080;
    server_name _;
    # Resolve the workspace on demand, including after container recreation.
    resolver 127.0.0.11 valid=5s ipv6=off;
    location / {
        set $workspace http://workspace:8765;
        proxy_pass $workspace;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
