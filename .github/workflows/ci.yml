name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            tools/ts-analyzer/package-lock.json
            tools/ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/py-analyzer/requirements-test.txt
      - name: Download Go modules
        run: go mod download
      - name: Install TypeScript analyzer dependencies
        run: npm ci --prefix tools/ts-analyzer --no-audit --no-fund
      - name: Install browser and frontend dependencies
        run: npm ci --prefix tools/ui --no-audit --no-fund
      - name: Install Python test dependencies
        run: |
          python3 -m venv .build/test-python
          .build/test-python/bin/python -m pip install --disable-pip-version-check -r tools/py-analyzer/requirements-test.txt
      - name: Restore Templ generator
        id: templ-cache
        uses: actions/cache/restore@v4
        with:
          path: .build/tools/bin/templ
          key: templ-v1-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}
      - name: Install pinned Templ generator
        env:
          GOBIN: ${{ github.workspace }}/.build/tools/bin
        run: |
          mkdir -p "$GOBIN"
          if [ ! -x "$GOBIN/templ" ]; then
            templ_version=$(go list -m -f '{{.Version}}' github.com/a-h/templ)
            go install "github.com/a-h/templ/cmd/templ@$templ_version"
          fi
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Save Templ generator
        if: steps.templ-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/tools/bin/templ
          key: ${{ steps.templ-cache.outputs.cache-primary-key }}
      - name: Install pinned Go quality tools
        uses: ./.github/actions/install-quality-tools
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - name: Install Chromium system libraries
        working-directory: tools/ui
        run: npx --no-install playwright install-deps chromium
      - name: Check formatting and generated artifacts
        run: |
          test -z "$(gofmt -l cmd internal)"
          templ generate
          npm run --prefix tools/ts-analyzer build
          cmp tools/py-analyzer/analyzer.py internal/analyzer/python/helper.py
          npm run --prefix tools/ui build
          git diff --exit-code -- internal
      - name: Required Go quality checks (live vulnerability database)
        run: python3 scripts/quality.py check
      - name: Upload Go quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-quality-reports
          path: .build/quality/reports/
          if-no-files-found: ignore
      - name: Build, vet and test offline
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          mkdir -p .build
          go build -o .build/seamgraph ./cmd/seamgraph
          .build/seamgraph check --root . --json
          go vet ./...
          go test -race ./...
          python3 -m unittest discover -s scripts/tests -v
          npm test --prefix tools/ts-analyzer
          python3 -m unittest discover -s tools/py-analyzer -v
          .build/test-python/bin/python -m unittest discover -s tools/test-runners -v
          npm test --prefix tools/ui

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build complete analysis runtime
        run: docker build --pull -t seamgraph:ci .
      - name: Verify runtimes and all language adapters
        run: |
          docker run --rm seamgraph:ci doctor --json
          for project in go typescript python mixed; do
            docker run --rm -v "$PWD/testdata/projects/$project:/project:ro" seamgraph:ci check --root /project --json
          done
      - name: Verify published local HTTP endpoint
        run: |
          docker run -d --name seamgraph-smoke -p 127.0.0.1:8765:8765 -v "$PWD/testdata/projects/mixed:/project:ro" seamgraph:ci serve --root /project --addr 0.0.0.0:8765 --allow-network
          trap 'docker logs seamgraph-smoke; docker rm -f seamgraph-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/api/model > /tmp/seamgraph-model.json
          python3 - <<'PY'
          import json
          with open('/tmp/seamgraph-model.json') as f:
              model = json.load(f)
          assert len(model['snapshot']['modules']) == 6
          assert len(model['snapshot']['seams']) == 3
          assert not model['check']['incomplete']
          PY
      - name: Verify CLI-only devcontainer ingress preserves isolated workspace networking
        run: |
          docker compose -f .devcontainer/compose.yaml config --quiet
          docker build -t seamgraph-dev-ui:ci .devcontainer/dev-ui
          docker network create --internal --opt com.docker.network.bridge.gateway_mode_ipv4=isolated seamgraph-private-ci
          docker network create seamgraph-ingress-ci
          trap 'docker logs seamgraph-relay-ci; docker rm -f seamgraph-relay-ci seamgraph-backend-ci; docker network rm seamgraph-private-ci seamgraph-ingress-ci' EXIT
          docker run -d --name seamgraph-backend-ci --network seamgraph-private-ci --network-alias workspace --cap-drop NET_ADMIN --cap-drop NET_RAW --label "devcontainer.local_folder=$PWD" --label "devcontainer.config_file=$PWD/.devcontainer/devcontainer.json" --label com.docker.compose.project=seamgraph-ingress-ci -v "$PWD/testdata/projects/mixed:/project:ro" seamgraph:ci serve --root /project --addr 0.0.0.0:8765 --allow-network
          docker create --name seamgraph-relay-ci --network seamgraph-ingress-ci --cap-drop ALL --read-only --tmpfs /tmp --label com.docker.compose.project=seamgraph-ingress-ci --label com.docker.compose.service=dev-ui -p 127.0.0.1::8080 seamgraph-dev-ui:ci
          docker network connect seamgraph-private-ci seamgraph-relay-ci
          docker start seamgraph-relay-ci
          url=$(python3 .devcontainer/browser-url.py --workspace-folder "$PWD")
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$url/" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$url/api/model" > /tmp/seamgraph-relay-model.json
          python3 - <<'PY'
          import json
          with open('/tmp/seamgraph-relay-model.json') as f:
              model = json.load(f)
          assert len(model['snapshot']['modules']) == 6
          assert len(model['snapshot']['seams']) == 3
          PY
          test "$(curl --silent -o /dev/null -w '%{http_code}' -H 'Host: untrusted.example' "$url/")" = 403
