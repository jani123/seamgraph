name: release
on:
  workflow_call:
concurrency:
  group: seamgraph-calendar-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate UTC calendar version or resume this source's release
        id: version
        run: python3 scripts/calendar-release.py plan --output "$GITHUB_OUTPUT"
  devbox:
    needs: [prepare, build]
    uses: ./.github/workflows/devbox.yml
    with:
      artifact: release
      version: ${{ needs.prepare.outputs.version }}
  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned Go quality tools
        uses: ./.github/actions/install-quality-tools
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - name: Required Go quality checks before release
        run: python3 scripts/quality.py check
      - name: Test release source
        run: |
          go test ./...
          go run ./cmd/seamgraph check --root .
      - name: Test installer failure and checksum handling
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Package all supported operating systems and architectures
        run: scripts/package-release.sh "$RELEASE_TAG" "$GITHUB_REPOSITORY" dist
      - name: Generate verified Devbox release metadata
        run: python3 scripts/update-devbox-release.py "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --assets-dir dist --output dist/devbox-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
          if-no-files-found: error
  smoke:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Smoke test native release binary
        shell: pwsh
        run: |
          $platform = if ($IsWindows) { 'windows' } elseif ($IsMacOS) { 'darwin' } else { 'linux' }
          $arch = if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64') { 'arm64' } else { 'amd64' }
          if ($IsWindows) {
            Expand-Archive "dist/seamgraph_${platform}_${arch}.zip" -DestinationPath extracted
            & ./extracted/seamgraph.exe version
          } else {
            New-Item -ItemType Directory extracted | Out-Null
            tar -xzf "dist/seamgraph_${platform}_${arch}.tar.gz" -C extracted
            & ./extracted/seamgraph version
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  publish:
    needs: [prepare, build, smoke, devbox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Publish versioned release and installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            # A retry must reuse immutable published assets, never overwrite them.
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --latest
          fi
      - name: Verify published downloads and update the default-branch Devbox pin
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
        run: |
          python3 scripts/update-devbox-release.py "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/devbox-release.json"
          python3 scripts/calendar-release.py pin "$RUNNER_TEMP/devbox-release.json"
